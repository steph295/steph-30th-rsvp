<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steph Turns 30</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=Caveat:wght@600;700&family=Fredoka:wght@700&family=Work+Sans:wght@400;500;600&display=swap');

:root {
  --paper: #efe8db;
  --paper-light: #f8f3ea;
  --ink: #1f2749;
  --ink-soft: #4a5070;
  --red: #b3261e;
  --pink: #ea8fae;
  --pink-deep: #d9668f;
  --sticker: #d7d7d7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #e6dfd2;
  font-family: 'Work Sans', system-ui, sans-serif;
  color: var(--ink);
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 440px;
  min-height: 100vh;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.25 0 0 0 0 0.2 0 0 0 0 0.12 0 0 0 0.09 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"),
    var(--paper);
  box-shadow: 0 0 60px rgba(0,0,0,0.12);
  overflow: hidden;
  padding-bottom: 48px;
}

.hero {
  position: relative;
  height: 590px;
  overflow: hidden;
}

.disco {
  position: absolute;
  border-radius: 50%;
  background-color: #d9dce0;
  background-image:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0) 44%),
    repeating-linear-gradient(0deg, rgba(20,20,30,0.28) 0 1.5px, transparent 1.5px 9px),
    repeating-linear-gradient(90deg, rgba(20,20,30,0.28) 0 1.5px, transparent 1.5px 9px),
    conic-gradient(from 20deg, #c9cdd3, #f2f3f5, #aeb3ba, #f6f7f8, #bfc4ca, #e6e8eb, #a7acb3, #eef0f2, #c9cdd3);
  box-shadow:
    inset -14px -16px 34px rgba(0,0,0,0.38),
    inset 10px 10px 22px rgba(255,255,255,0.6),
    0 18px 30px rgba(40,30,20,0.18);
}

.chain {
  position: absolute;
  top: -10px;
  width: 0;
  border-left: 3px dotted #8a8f96;
}

.star {
  position: absolute;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.star.chrome {
  background: linear-gradient(135deg, #ffffff 0%, #9ea2a8 35%, #f3f4f6 50%, #6e737a 68%, #dfe1e4 100%);
  filter: drop-shadow(0 6px 8px rgba(40,30,20,0.25));
}

.star.red {
  background: var(--red);
  opacity: 0.92;
}

.photo {
  position: absolute;
  top: 128px;
  left: 50%;
  width: 320px;
  height: 400px;
  margin-left: -160px;
  padding: 10px;
  background: var(--paper-light);
  border-radius: 160px 160px 26px 26px;
  box-shadow: 0 22px 36px rgba(40,30,20,0.28);
  transform: rotate(1.5deg);
}

.photo-window {
  width: 100%;
  height: 100%;
  border-radius: 150px 150px 18px 18px;
  overflow: hidden;
  position: relative;
  background: #222;
}

.photo-window img {
  position: absolute;
  width: 824px;
  height: 1099px;
  left: -313px;
  top: -272px;
  filter: grayscale(1) contrast(1.08) brightness(1.02);
}

.hat {
  position: absolute;
  top: 34px;
  left: 50%;
  width: 124px;
  height: 160px;
  margin-left: -86px;
  transform: rotate(-16deg);
  clip-path: polygon(50% 0%, 10% 100%, 90% 100%);
  background:
    radial-gradient(circle, rgba(255,255,255,0.85) 1.3px, transparent 1.9px) 0 0/10px 10px,
    linear-gradient(160deg, #f5b3c9 0%, var(--pink) 45%, var(--pink-deep) 100%);
  filter: drop-shadow(0 10px 12px rgba(120,50,80,0.3));
}

.pom {
  position: absolute;
  top: 18px;
  left: 50%;
  width: 34px;
  height: 34px;
  margin-left: -58px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff1b8, #e7b23e 55%, #b98a1c);
  box-shadow: 0 4px 8px rgba(120,80,0,0.3);
}

.thirty {
  position: absolute;
  top: 392px;
  left: 222px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 140px;
  line-height: 1;
  letter-spacing: -0.04em;
  transform: rotate(-7deg);
  background: linear-gradient(165deg, #ffffff 0%, #b9bdc3 28%, #f4f5f7 46%, #7a7f87 66%, #e2e4e7 84%, #9da2a9 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 10px 14px rgba(40,30,20,0.35));
}

.martini {
  position: absolute;
  top: 405px;
  left: 34px;
  width: 92px;
  height: 130px;
  transform: rotate(-9deg);
  filter: drop-shadow(0 8px 10px rgba(40,30,20,0.22));
}

.martini .cup {
  position: absolute;
  top: 0;
  left: 0;
  width: 92px;
  height: 58px;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(220,228,235,0.9));
  border-top: 3px solid #7a7f87;
}

.martini .drink {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 68px;
  height: 40px;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  background: linear-gradient(180deg, #f6a7c2, #e9789f);
}

.martini .olive {
  position: absolute;
  top: 8px;
  left: 30px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #a9c76a, #5f7a2e);
  border: 2px solid #f7f2e8;
}

.martini .stem {
  position: absolute;
  top: 56px;
  left: 43px;
  width: 6px;
  height: 52px;
  background: linear-gradient(90deg, #a8adb4, #eef0f2, #8b9098);
}

.martini .base {
  position: absolute;
  top: 104px;
  left: 16px;
  width: 60px;
  height: 14px;
  border-radius: 50%;
  background: linear-gradient(180deg, #d9dce0, #8b9098);
}

.headline {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: -6px;
}

.sticker-text {
  display: inline-block;
  background: var(--sticker);
  padding: 14px 26px 18px;
  border-radius: 18px;
  transform: rotate(-2deg);
  text-align: center;
  box-shadow: 0 12px 22px rgba(40,30,20,0.16);
}

.sticker-text .its {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 600;
  font-size: 40px;
  line-height: 1;
  color: var(--ink);
}

.sticker-text .bday {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 58px;
  line-height: 0.95;
  letter-spacing: -0.01em;
  color: var(--ink);
  text-transform: uppercase;
}

.details {
  text-align: center;
  font-family: 'Caveat', cursive;
  font-weight: 700;
  color: var(--ink);
  margin: 26px 24px 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.details .big { font-size: 40px; line-height: 1.1; }
.details .mid { font-size: 32px; line-height: 1.15; }
.details .note {
  font-family: 'Caveat', cursive;
  font-weight: 600;
  font-size: 26px;
  color: var(--red);
  margin-top: 10px;
}

.details a {
  font-family: 'Work Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-decoration: underline;
  text-underline-offset: 4px;
  margin-top: 8px;
  display: inline-block;
}

.note-card {
  margin: 34px 22px 0;
  background: var(--paper-light);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 24px 22px 22px;
  box-shadow: 8px 10px 0 rgba(31,39,73,0.18);
  position: relative;
}

.tape {
  position: absolute;
  top: -14px;
  left: 50%;
  width: 110px;
  height: 26px;
  margin-left: -55px;
  background: rgba(234,143,174,0.55);
  transform: rotate(-3deg);
}

.note-card h2 {
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 38px;
  line-height: 1;
  margin: 0 0 16px;
  text-align: center;
}

form { display: flex; flex-direction: column; gap: 16px; }

label.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

input[type="text"], textarea {
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: #fff;
  padding: 12px 14px;
  font-family: 'Work Sans', sans-serif;
  font-size: 16px;
  color: var(--ink);
  resize: vertical;
}

input[type="text"]:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
  outline: 3px solid var(--pink-deep);
  outline-offset: 2px;
}

.attend-row { display: flex; gap: 10px; }

.choice-btn {
  flex: 1;
  padding: 13px 10px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.choice-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

.choice-btn[aria-pressed="true"][data-choice="yes"] {
  background: var(--ink);
  color: #fff;
}

.choice-btn[aria-pressed="true"][data-choice="no"] {
  background: var(--sticker);
}

.stepper-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.stepper-row .lbl {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stepper-row .lbl small {
  font-family: 'Caveat', cursive;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: var(--red);
}

.stepper {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: #fff;
  padding: 4px 8px;
}

.stepper button {
  width: 32px;
  height: 32px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: var(--paper-light);
  color: var(--ink);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

.stepper output {
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 28px;
  min-width: 1.4ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.submit-btn {
  margin-top: 4px;
  padding: 15px 20px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: var(--pink);
  color: var(--ink);
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
}

.submit-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.submit-btn:disabled { opacity: 0.5; cursor: default; box-shadow: 4px 4px 0 var(--ink); transform: none; }

.hint { font-size: 13px; color: var(--ink-soft); margin: 0; min-height: 1.2em; }
.hint[data-state="error"] { color: var(--red); }
.hint[data-state="saving"] { color: var(--ink-soft); }

.confirm { display: flex; flex-direction: column; gap: 8px; text-align: center; }
.confirm h2 { margin-bottom: 4px; }
.confirm p { font-family: 'Caveat', cursive; font-size: 26px; font-weight: 600; margin: 0; color: var(--ink-soft); line-height: 1.25; }

.edit-link {
  align-self: center;
  margin-top: 6px;
  background: none;
  border: none;
  color: var(--ink-soft);
  font-family: 'Work Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 4px;
}

footer {
  margin: 36px 24px 0;
  text-align: center;
  font-family: 'Caveat', cursive;
  font-weight: 600;
  font-size: 24px;
  line-height: 1.3;
  color: var(--ink-soft);
}

footer .love { color: var(--red); font-size: 28px; font-weight: 700; display: block; margin-top: 6px; }

[hidden] { display: none !important; }

@media (max-width: 380px) {
  .hero { height: 560px; }
  .photo { width: 290px; height: 370px; margin-left: -145px; }
  .thirty { left: 200px; font-size: 126px; }
  .sticker-text .bday { font-size: 50px; }
}
</style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="disco" style="width:280px;height:280px;top:-110px;left:-90px;"></div>
      <div class="chain" style="left:344px;height:92px;"></div>
      <div class="disco" style="width:118px;height:118px;top:78px;left:285px;"></div>

      <div class="star chrome" style="width:70px;height:70px;top:214px;left:318px;transform:rotate(14deg);"></div>
      <div class="star chrome" style="width:48px;height:48px;top:292px;left:290px;transform:rotate(-10deg);"></div>
      <div class="star chrome" style="width:58px;height:58px;top:470px;left:18px;transform:rotate(22deg);"></div>
      <div class="star red" style="width:30px;height:30px;top:96px;left:236px;transform:rotate(12deg);"></div>
      <div class="star red" style="width:22px;height:22px;top:38px;left:260px;transform:rotate(-18deg);"></div>
      <div class="star red" style="width:30px;height:30px;top:520px;left:340px;transform:rotate(8deg);"></div>

      <div class="photo">
        <div class="photo-window"><img src="photo.jpg" alt="" width="824" height="1099"></div>
      </div>
      <div class="hat"></div>
      <div class="pom"></div>

      <div class="thirty">30</div>

      <div class="martini">
        <div class="cup"></div>
        <div class="drink"></div>
        <div class="olive"></div>
        <div class="stem"></div>
        <div class="base"></div>
      </div>
    </div>

    <div class="headline">
      <div class="sticker-text">
        <div class="its">It's my</div>
        <div class="bday">Birthday</div>
      </div>
    </div>

    <div class="details">
      <div class="big">Saturday 24th October</div>
      <div class="mid">6pm onwards</div>
      <div class="mid">Druid St, London SE1 2HQ</div>
      <div class="note">A little 30th shin dig. More the merrier!</div>
      <a href="https://www.google.com/maps/search/?api=1&query=Druid+St%2C+London+SE1+2HQ" target="_blank" rel="noopener">Get directions</a>
    </div>

    <div class="note-card">
      <div class="tape"></div>
      <h2 id="cardTitle">Are you coming?</h2>

      <form id="rsvpForm">
        <label class="field">
          Your name
          <input type="text" id="nameInput" name="name" autocomplete="name" required maxlength="60">
        </label>

        <div class="attend-row" role="group" aria-label="Are you coming">
          <button type="button" class="choice-btn" data-choice="yes" aria-pressed="false">I'm in!</button>
          <button type="button" class="choice-btn" data-choice="no" aria-pressed="false">Can't make it</button>
        </div>

        <div class="stepper-row" id="plusOneRow" hidden>
          <div class="lbl">Plus ones <small>bring whoever</small></div>
          <div class="stepper">
            <button type="button" id="minusBtn" aria-label="Fewer plus ones">−</button>
            <output id="plusCount">0</output>
            <button type="button" id="plusBtn" aria-label="More plus ones">+</button>
          </div>
        </div>

        <label class="field">
          Message (optional)
          <textarea id="noteInput" name="note" rows="2" maxlength="200"></textarea>
        </label>

        <button type="submit" class="submit-btn" id="submitBtn" disabled>Send RSVP</button>
        <p class="hint" id="formHint"></p>
      </form>

      <div class="confirm" id="confirmView" hidden>
        <p id="confirmBody"></p>
        <button type="button" class="edit-link" id="editLink">Change my answer</button>
      </div>
    </div>

    <footer>
      Know someone I've forgotten? Forward this on.
      <span class="love">Love, Steph &#10084;&#65039;</span>
    </footer>
  </div>

<script>
(function () {
  // ---- Where RSVPs get sent -----------------------------------------
  // Fill these in once the Google Form is created (see setup notes),
  // then commit + push. Until FORM_ACTION is set, submissions are only
  // saved on the guest's own device (still shows the confirmation).
  var FORM_ACTION = ""; // e.g. "https://docs.google.com/forms/d/e/XXXXXXX/formResponse"
  var ENTRY = {
    name: "",       // e.g. "entry.123456789"
    attending: "",  // e.g. "entry.234567890"
    plusOnes: "",   // e.g. "entry.345678901"
    note: ""        // e.g. "entry.456789012"
  };
  // ---------------------------------------------------------------------

  var LS_KEY = "stephBday30Rsvp";

  function readLocalRecord() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeLocalRecord(rec) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(rec)); } catch (e) {}
  }

  function sendToSheet(record) {
    if (!FORM_ACTION || !ENTRY.name) return Promise.resolve(false);
    var body = new URLSearchParams();
    body.append(ENTRY.name, record.name);
    body.append(ENTRY.attending, record.attending ? "Yes" : "No");
    body.append(ENTRY.plusOnes, String(record.plusOnes || 0));
    body.append(ENTRY.note, record.note || "");
    return fetch(FORM_ACTION, { method: "POST", mode: "no-cors", body: body })
      .then(function () { return true; })
      .catch(function () { return false; });
  }

  var form = document.getElementById("rsvpForm");
  var nameInput = document.getElementById("nameInput");
  var noteInput = document.getElementById("noteInput");
  var submitBtn = document.getElementById("submitBtn");
  var formHint = document.getElementById("formHint");
  var plusOneRow = document.getElementById("plusOneRow");
  var plusCount = document.getElementById("plusCount");
  var confirmView = document.getElementById("confirmView");
  var cardTitle = document.getElementById("cardTitle");

  var attending = null;
  var plusOnes = 0;

  function updateSubmitState() {
    submitBtn.disabled = !(nameInput.value.trim() && attending !== null);
  }

  Array.prototype.forEach.call(document.querySelectorAll(".choice-btn"), function (btn) {
    btn.addEventListener("click", function () {
      attending = btn.dataset.choice === "yes";
      Array.prototype.forEach.call(document.querySelectorAll(".choice-btn"), function (b) {
        b.setAttribute("aria-pressed", "false");
      });
      btn.setAttribute("aria-pressed", "true");
      plusOneRow.hidden = !attending;
      updateSubmitState();
    });
  });

  document.getElementById("minusBtn").addEventListener("click", function () {
    plusOnes = Math.max(0, plusOnes - 1);
    plusCount.textContent = String(plusOnes);
  });
  document.getElementById("plusBtn").addEventListener("click", function () {
    plusOnes += 1;
    plusCount.textContent = String(plusOnes);
  });

  nameInput.addEventListener("input", updateSubmitState);

  function showConfirm(rec) {
    form.hidden = true;
    confirmView.hidden = false;
    var body = document.getElementById("confirmBody");
    if (rec.attending) {
      cardTitle.textContent = "You're in, " + rec.name + "!";
      body.textContent = rec.plusOnes > 0
        ? "See you 6pm on Druid St — you plus " + rec.plusOnes + "."
        : "See you 6pm on Druid St.";
    } else {
      cardTitle.textContent = "Noted, " + rec.name;
      body.textContent = "Gutted you can't make it — you'll be missed.";
    }
  }

  function showForm(prefill) {
    confirmView.hidden = true;
    form.hidden = false;
    cardTitle.textContent = "Are you coming?";
    if (prefill) {
      nameInput.value = prefill.name || "";
      noteInput.value = prefill.note || "";
      attending = prefill.attending;
      plusOnes = prefill.plusOnes || 0;
      plusCount.textContent = String(plusOnes);
      plusOneRow.hidden = !attending;
      Array.prototype.forEach.call(document.querySelectorAll(".choice-btn"), function (b) {
        b.setAttribute("aria-pressed", String((b.dataset.choice === "yes") === !!attending));
      });
    }
    updateSubmitState();
  }

  document.getElementById("editLink").addEventListener("click", function () {
    showForm(readLocalRecord());
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = nameInput.value.trim();
    if (!name || attending === null) return;
    var record = {
      name: name,
      attending: attending,
      plusOnes: attending ? plusOnes : 0,
      note: noteInput.value.trim(),
      ts: Date.now()
    };
    writeLocalRecord(record);
    showConfirm(record);
    formHint.textContent = "";
    sendToSheet(record);
  });

  var local = readLocalRecord();
  if (local) {
    showConfirm(local);
  } else {
    showForm(null);
  }
})();
</script>
</body>
</html>
