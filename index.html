<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steph Turns 30</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap');

:root {
  --paper: #efe8db;
  --paper-light: #f8f3ea;
  --ink: #1f2749;
  --ink-soft: #4a5070;
  --red: #b3261e;
  --pink: #ea8fae;
  --pink-deep: #d9668f;
  --sticker: #d7d7d7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #e6dfd2;
  font-family: 'Work Sans', system-ui, sans-serif;
  color: var(--ink);
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 440px;
  min-height: 100vh;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.25 0 0 0 0 0.2 0 0 0 0 0.12 0 0 0 0.09 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"),
    var(--paper);
  box-shadow: 0 0 60px rgba(0,0,0,0.12);
  overflow: hidden;
  padding-bottom: 48px;
}

.hero {
  position: relative;
  height: 700px;
  overflow: hidden;
}

.disco {
  position: absolute;
  display: block;
  filter: drop-shadow(0 14px 22px rgba(40,30,20,0.25));
}

.chain {
  position: absolute;
  top: -10px;
  width: 0;
  border-left: 3px dotted #8a8f96;
}

.star {
  position: absolute;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.star.chrome {
  background: linear-gradient(135deg, #ffffff 0%, #9ea2a8 35%, #f3f4f6 50%, #6e737a 68%, #dfe1e4 100%);
  filter: drop-shadow(0 6px 8px rgba(40,30,20,0.25));
}

.star.red {
  background: var(--red);
  opacity: 0.92;
}

.cutout {
  position: absolute;
  top: 178px;
  left: 50%;
  width: 320px;
  height: 420px;
  margin-left: -160px;
  clip-path: url(#portraitBlob);
  filter: drop-shadow(0 18px 20px rgba(40,30,20,0.38));
}

.cutout img {
  position: absolute;
  width: 948px;
  height: 1264px;
  left: -382px;
  top: -278px;
}

.hat {
  position: absolute;
  top: 66px;
  left: 50%;
  width: 132px;
  height: 168px;
  margin-left: -94px;
  transform: rotate(-16deg);
  clip-path: polygon(50% 0%, 10% 100%, 90% 100%);
  background:
    radial-gradient(circle, rgba(255,255,255,0.9) 1.4px, transparent 2px) 0 0/9px 9px,
    linear-gradient(160deg, #f7bdd3 0%, var(--pink) 42%, var(--pink-deep) 78%, #c14a78 100%);
  filter: drop-shadow(0 10px 12px rgba(120,50,80,0.32));
}

.pom {
  position: absolute;
  top: 50px;
  left: 50%;
  width: 34px;
  height: 34px;
  margin-left: -66px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff1b8, #e7b23e 55%, #b98a1c);
  box-shadow: 0 4px 8px rgba(120,80,0,0.3);
}

.ribbon-shadow {
  position: absolute;
  top: 573px;
  left: 50%;
  width: 300px;
  height: 84px;
  margin-left: -160px;
  transform: rotate(-5deg);
  clip-path: polygon(0% 0%, 82% 0%, 100% 50%, 82% 100%, 0% 100%);
  background: #7d818a;
}

.ribbon {
  position: absolute;
  top: 563px;
  left: 50%;
  width: 300px;
  height: 84px;
  margin-left: -160px;
  transform: rotate(-5deg);
  clip-path: polygon(0% 0%, 82% 0%, 100% 50%, 82% 100%, 0% 100%);
  background:
    radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1.4px) 0 0/9px 9px,
    linear-gradient(155deg, #f4f5f6 0%, #c7cbd0 32%, #eef0f2 52%, #9297a0 78%, #d3d6da 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.ribbon span {
  font-family: 'Anton', sans-serif;
  font-weight: 400;
  font-size: 34px;
  letter-spacing: 0.02em;
  color: #201f26;
  text-transform: uppercase;
}

.details {
  text-align: center;
  font-family: 'Caveat', cursive;
  font-weight: 700;
  color: var(--ink);
  margin: 26px 24px 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.details .big { font-size: 40px; line-height: 1.1; }
.details .mid { font-size: 32px; line-height: 1.15; }
.details .tbc {
  font-family: 'Work Sans', sans-serif;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 2px;
}
.details .note {
  font-family: 'Caveat', cursive;
  font-weight: 600;
  font-size: 26px;
  color: var(--red);
  margin-top: 10px;
}

.details a {
  font-family: 'Work Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-decoration: underline;
  text-underline-offset: 4px;
  margin-top: 8px;
  display: inline-block;
}

.note-card {
  margin: 34px 22px 0;
  background: var(--paper-light);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 24px 22px 22px;
  box-shadow: 8px 10px 0 rgba(31,39,73,0.18);
  position: relative;
}

.tape {
  position: absolute;
  top: -14px;
  left: 50%;
  width: 110px;
  height: 26px;
  margin-left: -55px;
  background: rgba(234,143,174,0.55);
  transform: rotate(-3deg);
}

.note-card h2 {
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 38px;
  line-height: 1;
  margin: 0 0 16px;
  text-align: center;
}

form { display: flex; flex-direction: column; gap: 16px; }

label.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

input[type="text"], textarea {
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: #fff;
  padding: 12px 14px;
  font-family: 'Work Sans', sans-serif;
  font-size: 16px;
  color: var(--ink);
  resize: vertical;
}

input[type="text"]:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
  outline: 3px solid var(--pink-deep);
  outline-offset: 2px;
}

.attend-row { display: flex; gap: 10px; }

.choice-btn {
  flex: 1;
  padding: 13px 10px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.choice-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

.choice-btn[aria-pressed="true"][data-choice="yes"] {
  background: var(--ink);
  color: #fff;
}

.choice-btn[aria-pressed="true"][data-choice="no"] {
  background: var(--sticker);
}

.stepper-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.stepper-row .lbl {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stepper-row .lbl small {
  font-family: 'Caveat', cursive;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: var(--red);
}

.stepper {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: #fff;
  padding: 4px 8px;
}

.stepper button {
  width: 32px;
  height: 32px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: var(--paper-light);
  color: var(--ink);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

.stepper output {
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 28px;
  min-width: 1.4ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.submit-btn {
  margin-top: 4px;
  padding: 15px 20px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  background: var(--pink);
  color: var(--ink);
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
}

.submit-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.submit-btn:disabled { opacity: 0.5; cursor: default; box-shadow: 4px 4px 0 var(--ink); transform: none; }

.hint { font-size: 13px; color: var(--ink-soft); margin: 0; min-height: 1.2em; }
.hint[data-state="error"] { color: var(--red); }
.hint[data-state="saving"] { color: var(--ink-soft); }

.confirm { display: flex; flex-direction: column; gap: 8px; text-align: center; }
.confirm h2 { margin-bottom: 4px; }
.confirm p { font-family: 'Caveat', cursive; font-size: 26px; font-weight: 600; margin: 0; color: var(--ink-soft); line-height: 1.25; }

.edit-link {
  align-self: center;
  margin-top: 6px;
  background: none;
  border: none;
  color: var(--ink-soft);
  font-family: 'Work Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 4px;
}

footer {
  margin: 36px 24px 0;
  text-align: center;
  font-family: 'Caveat', cursive;
  font-weight: 600;
  font-size: 24px;
  line-height: 1.3;
  color: var(--ink-soft);
}

footer .love { color: var(--red); font-size: 28px; font-weight: 700; display: block; margin-top: 6px; }

[hidden] { display: none !important; }

@media (max-width: 380px) {
  .hero { height: 660px; }
  .cutout { width: 290px; height: 390px; margin-left: -145px; }
  .ribbon, .ribbon-shadow { width: 270px; margin-left: -145px; }
  .ribbon span { font-size: 30px; }
}
</style>
</head>
<body>
  <div class="page">
    <svg width="0" height="0" style="position:absolute">
      <clipPath id="portraitBlob" clipPathUnits="objectBoundingBox">
        <path d="M0.44,0.03 C0.33,0.03 0.24,0.09 0.20,0.19 C0.14,0.27 0.09,0.32 0.08,0.44 C0.07,0.58 0.10,0.65 0.17,0.71 C0.14,0.82 0.16,0.92 0.24,0.98 L0.76,0.98 C0.84,0.92 0.86,0.82 0.83,0.71 C0.90,0.65 0.93,0.58 0.92,0.44 C0.91,0.32 0.86,0.27 0.80,0.19 C0.76,0.09 0.67,0.03 0.56,0.03 C0.52,0.01 0.48,0.01 0.44,0.03 Z"/>
      </clipPath>
    </svg>

    <div class="hero">
      <canvas class="disco" data-size="260" style="top:-110px;left:-90px;"></canvas>
      <canvas class="disco" data-size="150" style="top:60px;left:0px;"></canvas>
      <canvas class="disco" data-size="210" style="top:-55px;left:120px;"></canvas>
      <canvas class="disco" data-size="130" style="top:130px;left:210px;"></canvas>
      <canvas class="disco" data-size="240" style="top:-125px;left:260px;"></canvas>
      <canvas class="disco" data-size="175" style="top:-30px;left:410px;"></canvas>
      <canvas class="disco" data-size="150" style="top:65px;left:335px;"></canvas>
      <canvas class="disco" data-size="110" style="top:155px;left:85px;"></canvas>

      <div class="star chrome" style="width:34px;height:34px;top:26px;left:255px;transform:rotate(-12deg);"></div>
      <div class="star red" style="width:26px;height:26px;top:6px;left:90px;transform:rotate(12deg);"></div>
      <div class="star red" style="width:22px;height:22px;top:150px;left:350px;transform:rotate(-18deg);"></div>
      <div class="star chrome" style="width:46px;height:46px;top:230px;left:20px;transform:rotate(20deg);"></div>
      <div class="star red" style="width:28px;height:28px;top:585px;left:360px;transform:rotate(10deg);"></div>

      <div class="hat"></div>
      <div class="pom"></div>

      <div class="cutout">
        <img src="photo-v2.jpg" alt="" width="824" height="1099">
      </div>

      <div class="ribbon-shadow"></div>
      <div class="ribbon"><span>Birthday Girl</span></div>
    </div>

    <div class="details">
      <div class="big">Saturday 24th October</div>
      <div class="mid">6pm onwards</div>
      <div class="mid">Druid St, London SE1 2HQ</div>
      <div class="tbc">Exact venue TBC</div>
      <div class="note">A little 30th shin dig. More the merrier!</div>
      <a href="https://www.google.com/maps/search/?api=1&query=Druid+St%2C+London+SE1+2HQ" target="_blank" rel="noopener">Get directions</a>
    </div>

    <div class="note-card">
      <div class="tape"></div>
      <h2 id="cardTitle">Are you coming?</h2>

      <form id="rsvpForm">
        <label class="field">
          Full name (first &amp; last)
          <input type="text" id="nameInput" name="name" autocomplete="name" placeholder="e.g. Jane Smith" required maxlength="60">
        </label>

        <div class="attend-row" role="group" aria-label="Are you coming">
          <button type="button" class="choice-btn" data-choice="yes" aria-pressed="false">I'm in!</button>
          <button type="button" class="choice-btn" data-choice="no" aria-pressed="false">Can't make it</button>
        </div>

        <div class="stepper-row" id="plusOneRow" hidden>
          <div class="lbl">Plus ones <small>bring whoever</small></div>
          <div class="stepper">
            <button type="button" id="minusBtn" aria-label="Fewer plus ones">−</button>
            <output id="plusCount">0</output>
            <button type="button" id="plusBtn" aria-label="More plus ones">+</button>
          </div>
        </div>

        <label class="field">
          Message (optional)
          <textarea id="noteInput" name="note" rows="2" maxlength="200"></textarea>
        </label>

        <button type="submit" class="submit-btn" id="submitBtn" disabled>Send RSVP</button>
        <p class="hint" id="formHint"></p>
      </form>

      <div class="confirm" id="confirmView" hidden>
        <p id="confirmBody"></p>
        <button type="button" class="edit-link" id="editLink">Change my answer</button>
      </div>
    </div>

    <footer>
      Know someone I've forgotten? Forward this on.
      <span class="love">Love, Steph &#10084;&#65039;</span>
    </footer>
  </div>

<script>
(function () {
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function renderDisco(canvas, seed) {
    var size = canvas.width;
    var ctx = canvas.getContext("2d");
    var R = size / 2;
    var rand = mulberry32(seed);

    ctx.save();
    ctx.beginPath();
    ctx.arc(R, R, R, 0, Math.PI * 2);
    ctx.clip();

    var tileSize = Math.max(size / 15, 8);
    var numRows = Math.max(7, Math.round(size / tileSize));
    var tintHues = [340, 42, 265, 200];
    var lightX = size * 0.3, lightY = size * 0.22;

    for (var i = 0; i < numRows; i++) {
      var rowH = size / numRows;
      var y0 = i * rowH;
      var rowCenterY = y0 + rowH / 2;
      var dy = (rowCenterY - R) / R;
      var halfW = R * Math.sqrt(Math.max(0, 1 - dy * dy));
      if (halfW < 2) continue;
      var numTiles = Math.max(3, Math.round((2 * halfW) / tileSize));
      var tileW = (2 * halfW) / numTiles;

      for (var j = 0; j < numTiles; j++) {
        var x0 = (R - halfW) + j * tileW;
        var cx = x0 + tileW / 2, cy = y0 + rowH / 2;
        var ddx = (cx - lightX) / size, ddy = (cy - lightY) / size;
        var distFromLight = Math.sqrt(ddx * ddx + ddy * ddy);
        var shade = 1 - Math.min(0.62, distFromLight * 0.95);
        var globalShade = 0.72 + 0.28 * shade;
        var jitterBase = 66 + rand() * 26;
        var lightness = Math.max(48, Math.min(96, jitterBase * globalShade));

        var color;
        if (rand() < 0.09) {
          var hue = tintHues[Math.floor(rand() * tintHues.length)];
          color = "hsl(" + hue + ", 24%, " + lightness + "%)";
        } else {
          color = "hsl(220, 4%, " + lightness + "%)";
        }
        ctx.fillStyle = color;
        ctx.fillRect(x0, y0, Math.max(1, tileW - 1), Math.max(1, rowH - 1));
      }
    }

    ctx.globalCompositeOperation = "screen";
    var hi = ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, size * 0.65);
    hi.addColorStop(0, "rgba(255,255,255,0.95)");
    hi.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = hi;
    ctx.fillRect(0, 0, size, size);

    ctx.globalCompositeOperation = "multiply";
    var rim = ctx.createRadialGradient(size * 0.5, size * 0.55, size * 0.4, size * 0.5, size * 0.5, size * 0.72);
    rim.addColorStop(0, "rgba(0,0,0,0)");
    rim.addColorStop(1, "rgba(0,0,0,0.32)");
    ctx.fillStyle = rim;
    ctx.fillRect(0, 0, size, size);

    ctx.restore();
  }

  Array.prototype.forEach.call(document.querySelectorAll("canvas.disco"), function (c, idx) {
    var displaySize = parseInt(c.getAttribute("data-size"), 10);
    var dpr = 2;
    c.width = displaySize * dpr;
    c.height = displaySize * dpr;
    c.style.width = displaySize + "px";
    c.style.height = displaySize + "px";
    renderDisco(c, idx * 97711 + 4242);
  });

  // ---- Where RSVPs get sent -----------------------------------------
  // Fill these in once the Google Form is created (see setup notes),
  // then commit + push. Until FORM_ACTION is set, submissions are only
  // saved on the guest's own device (still shows the confirmation).
  var FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLScAlJgEMwmJnB_H5za8fFtUYMkSn2fai7sL7c7ggynWb56cdw/formResponse";
  var ENTRY = {
    name: "entry.389822981",
    attending: "entry.2143385546",
    plusOnes: "entry.1092522390",
    note: "entry.1495900919"
  };
  var ATTEND_YES = "Yes, absolutely!";
  var ATTEND_NO = "Unfortunately, I cannot make it.";
  // ---------------------------------------------------------------------

  var LS_KEY = "stephBday30Rsvp";

  function readLocalRecord() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeLocalRecord(rec) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(rec)); } catch (e) {}
  }

  function sendToSheet(record) {
    if (!FORM_ACTION || !ENTRY.name) return Promise.resolve(false);
    var body = new URLSearchParams();
    body.append(ENTRY.name, record.name);
    body.append(ENTRY.attending, record.attending ? ATTEND_YES : ATTEND_NO);
    body.append(ENTRY.plusOnes, String(record.plusOnes || 0));
    body.append(ENTRY.note, record.note || "");
    return fetch(FORM_ACTION, { method: "POST", mode: "no-cors", body: body })
      .then(function () { return true; })
      .catch(function () { return false; });
  }

  var form = document.getElementById("rsvpForm");
  var nameInput = document.getElementById("nameInput");
  var noteInput = document.getElementById("noteInput");
  var submitBtn = document.getElementById("submitBtn");
  var formHint = document.getElementById("formHint");
  var plusOneRow = document.getElementById("plusOneRow");
  var plusCount = document.getElementById("plusCount");
  var confirmView = document.getElementById("confirmView");
  var cardTitle = document.getElementById("cardTitle");

  var attending = null;
  var plusOnes = 0;

  function hasFullName() {
    return nameInput.value.trim().split(/\s+/).filter(Boolean).length >= 2;
  }

  function updateSubmitState() {
    var name = nameInput.value.trim();
    submitBtn.disabled = !(name && attending !== null && hasFullName());
    if (name && !hasFullName()) {
      formHint.dataset.state = "";
      formHint.textContent = "Please enter your first and last name.";
    } else {
      formHint.textContent = "";
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll(".choice-btn"), function (btn) {
    btn.addEventListener("click", function () {
      attending = btn.dataset.choice === "yes";
      Array.prototype.forEach.call(document.querySelectorAll(".choice-btn"), function (b) {
        b.setAttribute("aria-pressed", "false");
      });
      btn.setAttribute("aria-pressed", "true");
      plusOneRow.hidden = !attending;
      updateSubmitState();
    });
  });

  document.getElementById("minusBtn").addEventListener("click", function () {
    plusOnes = Math.max(0, plusOnes - 1);
    plusCount.textContent = String(plusOnes);
  });
  document.getElementById("plusBtn").addEventListener("click", function () {
    plusOnes += 1;
    plusCount.textContent = String(plusOnes);
  });

  nameInput.addEventListener("input", updateSubmitState);

  function showConfirm(rec) {
    form.hidden = true;
    confirmView.hidden = false;
    var body = document.getElementById("confirmBody");
    if (rec.attending) {
      cardTitle.textContent = "You're in, " + rec.name + "!";
      body.textContent = rec.plusOnes > 0
        ? "Can't wait to see you there — you plus " + rec.plusOnes + "."
        : "Can't wait to see you there.";
    } else {
      cardTitle.textContent = "Noted, " + rec.name;
      body.textContent = "Gutted you can't make it — you'll be missed.";
    }
  }

  function showForm(prefill) {
    confirmView.hidden = true;
    form.hidden = false;
    cardTitle.textContent = "Are you coming?";
    if (prefill) {
      nameInput.value = prefill.name || "";
      noteInput.value = prefill.note || "";
      attending = prefill.attending;
      plusOnes = prefill.plusOnes || 0;
      plusCount.textContent = String(plusOnes);
      plusOneRow.hidden = !attending;
      Array.prototype.forEach.call(document.querySelectorAll(".choice-btn"), function (b) {
        b.setAttribute("aria-pressed", String((b.dataset.choice === "yes") === !!attending));
      });
    }
    updateSubmitState();
  }

  document.getElementById("editLink").addEventListener("click", function () {
    showForm(readLocalRecord());
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = nameInput.value.trim();
    if (!name || attending === null) return;
    var record = {
      name: name,
      attending: attending,
      plusOnes: attending ? plusOnes : 0,
      note: noteInput.value.trim(),
      ts: Date.now()
    };
    writeLocalRecord(record);
    showConfirm(record);
    formHint.textContent = "";
    sendToSheet(record);
  });

  var local = readLocalRecord();
  if (local) {
    showConfirm(local);
  } else {
    showForm(null);
  }
})();
</script>
</body>
</html>
